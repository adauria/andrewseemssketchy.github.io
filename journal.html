---
layout: default
title: Journal
permalink: /journal/
---
<h1>Journal</h1>
<ul class="post-list">
{% for post in site.posts %}
<li>
<p class="post-date">{{ post.date | date: "%B %-d, %Y" }}</p>
<h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
<p>{{ post.excerpt | strip_html | truncatewords: 28 }}</p>
</li>
{% endfor %}
</ul>
